[project]
name = "adb-mcp-server"
version = "1.0.0"
description = "MCP Server para comunicação com dispositivos Android via ADB"
authors = [
    { name = "Cristiano Ritta", email = "tiano.ritta@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]